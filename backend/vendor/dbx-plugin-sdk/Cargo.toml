[package]
name = "dbx-plugin-sdk"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Sidecar protocol SDK for DBX plugins"

# 上游这一行是 [workspace]（它自己是个独立 workspace）。作为 path 依赖嵌进
# backend 之后会变成「一个 workspace 里两个 root」，cargo 直接拒编译，所以删掉。
# 其余内容与上游逐字节一致。

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
