[package]
name = "dbx-plugin-warren-polaris-api"
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"

[workspace]
# vendored SDK 不当成本 workspace 的成员：它按上游原样保留，不该被我们这边的
# clippy -D warnings 顺手打回去（它自己有自己的 lint 口径）。
exclude = ["vendor/dbx-plugin-sdk"]

[dependencies]
# dbx-plugin-sdk 没有发布到 crates.io，只能按源码用。这里 vendor 了一份（Apache-2.0，
# 来源见 vendor/dbx-plugin-sdk/README.md），这样 clone 下来直接 cargo build 就能过，
# 不需要再 `--config patch.crates-io.dbx-plugin-sdk.path=...` 指到某台机器上的副本。
dbx-plugin-sdk = { path = "vendor/dbx-plugin-sdk" }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
base64 = "0.22"

# Keep plugin binaries close to the host app's size: default release settings
# leave ~20MB of symbols and unoptimized generic code in an OpenDAL-sized backend.
# panic stays "unwind" so the sidecar protocol can report panics as errors.
[profile.release]
strip = true
lto = true
codegen-units = 1
